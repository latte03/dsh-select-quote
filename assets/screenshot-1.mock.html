<!--
  screenshot-1.png 的源文件（不是应用截图，是按产品真实设计 token 渲染的示意图）。

  渲染方式：
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1200,760 \
      --screenshot=assets/screenshot-1.png \
      "file://$PWD/assets/screenshot-1.mock.html"

  颜色与尺寸取自 dsh-client-ui-theme 的 design-platform token、composer/chat 的
  CSS，以及本插件自己的 styles.ts，所以改动插件样式时应同步更新这里。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 颜色/尺寸取自产品真实 token（dsh-client-ui-theme 的 design-platform CSS）
     与插件自身的 styles.ts，尽量贴近实际渲染结果。 */
  :root {
    --bg-base: #ffffff;
    --label-primary: #0f1115;
    --label-secondary: #61666b;
    --label-tertiary: #81858c;
    --link: #4176e6;
    --accent: #3b82f6;
    --accent-400: #1677ff;
    --accent-tint: #eaf3ff;
    --border-l1: rgba(0, 0, 0, 0.04);
    --border-l2: rgba(0, 0, 0, 0.10);
    --border-l4: rgba(0, 0, 0, 0.16);
    --fill-hover: #f5f5f5;
    --bubble: #edf3fe;
    --input-major: #ffffff;
    --menu-fill: rgba(248, 249, 250, 0.94);
    --menu-backdrop: blur(40px) saturate(150%);
    --elevation-stroke-color: rgba(0, 0, 0, 0.16);
    --elevation-stroke: 0 0 0 .5px var(--elevation-stroke-color);
    --elevation-prominent: var(--elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 760px; overflow: hidden;
    background: var(--bg-base); color: var(--label-primary);
    font-family: var(--font); font-size: 14px; line-height: 22px;
    -webkit-font-smoothing: antialiased;
  }
  .app { position: relative; height: 100%; }
  .chat {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    padding-top: 26px;
  }
  .stream { width: 760px; display: flex; flex-direction: column; gap: 22px; }

  /* ---------- 助手消息 ---------- */
  .status { display: flex; align-items: center; gap: 8px; color: var(--label-tertiary); font-size: 12px; line-height: 18px; }
  .status .n {
    display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    border: .5px solid var(--border-l2); border-radius: 6px; font-size: 11px; color: var(--label-secondary);
  }
  .msg p { margin: 10px 0 0; color: var(--label-primary); }
  .msg code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: #f5f5f5; border-radius: 5px; padding: 1px 5px;
  }

  /* 正文里的批注标记：淡色底 + 虚线下划线 + 末尾序号角标 */
  .mark {
    position: relative;
    background: var(--accent-tint);
    border-radius: 2px;
    text-decoration: underline dashed var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 2px;
  }
  .mark::after {
    content: "1";
    position: absolute;
    bottom: 8px;
    left: 100%;
    display: grid;
    place-items: center;
    min-width: 15px;
    height: 15px;
    margin-left: 2px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    line-height: 1;
    pointer-events: none;
  }

  /* ---------- 模型回指 chip ---------- */
  .chip {
    appearance: none;
    margin: 0 2px;
    padding: 0 6px;
    border: .5px solid var(--border-l2);
    border-radius: 6px;
    background: var(--fill-hover);
    color: var(--link);
    font: inherit;
    font-size: 12px;
    line-height: 18px;
    cursor: pointer;
    vertical-align: baseline;
  }

  /* ---------- 用户回合：批注摘要 + 气泡 ---------- */
  .turn-user { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .bubble {
    max-width: 76%; padding: 10px 16px; border-radius: 22px; background: var(--bubble);
    color: var(--label-primary); line-height: 22px;
  }

  /* 对话记录里的批注摘要块（未展开） */
  .summary {
    display: flex; align-items: center; gap: 10px;
    width: 160px; padding: 8px 10px;
    border: .5px solid var(--border-l2); border-radius: 18px; background: #fff;
  }
  .summary-icon {
    flex: none; width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--fill-hover); color: var(--link);
    font-size: 13px; font-weight: 600;
  }
  .summary-title { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--label-primary); }
  .summary-hint { font-size: 12px; line-height: 18px; color: var(--label-tertiary); }

  /* ---------- chip 预览浮层 ---------- */
  .preview {
    position: absolute; z-index: 30;
    left: 582px; top: 376px;
    display: flex; flex-direction: column; gap: 6px;
    width: 320px; padding: 10px;
    border-radius: 14px;
    background: var(--menu-fill);
    backdrop-filter: var(--menu-backdrop); -webkit-backdrop-filter: var(--menu-backdrop);
    /* 插件把浮层的描边环覆写成 border-l1，比宿主默认的 elevation 更淡 */
    box-shadow: 0 0 0 .5px var(--border-l1), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
  }
  .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .preview-title { font-size: 13px; font-weight: 600; line-height: 18px; color: var(--label-primary); }
  .jump {
    appearance: none; border: 0; flex: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-height: 28px; padding: 0 9px; border-radius: 7px;
    background: var(--accent); color: #fff;
    font: inherit; font-size: 12px; font-weight: 500; line-height: 1;
    white-space: nowrap; cursor: pointer;
  }
  .jump svg { width: 12px; height: 12px; }
  .preview-label { margin-top: 2px; font-size: 11px; line-height: 16px; color: var(--label-tertiary); }
  .preview-quote, .preview-comment {
    font-size: 13px; line-height: 19px; color: var(--label-primary);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .preview-comment { color: var(--label-secondary); }

  /* ---------- 输入区 ---------- */
  .composer { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 0 10px; }
  .composer-card {
    width: 760px; padding-top: 8px; border-radius: 22px; background: var(--input-major);
    box-shadow: var(--elevation-prominent); display: flex; flex-direction: column; gap: 12px;
  }
  .editor { padding: 0 16px; min-height: 24px; color: var(--label-primary); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 8px 8px; }
  .tools, .trailing { display: flex; align-items: center; gap: 12px; }
  .iconbtn {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: var(--label-secondary); border: .5px solid var(--border-l2);
  }
  .mode {
    display: inline-flex; align-items: center; gap: 5px; color: #dd8629;
    font-size: 13px; padding: 3px 9px; border-radius: 999px; background: rgba(247, 173, 49, 0.10);
  }
  .picker { display: inline-flex; align-items: center; gap: 6px; color: var(--label-secondary); font-size: 13px; }
  .picker .dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #4176e6, #7aa7ff); }
  .send {
    width: 32px; height: 32px; border-radius: 999px; background: #0f1115; color: #fff;
    display: grid; place-items: center; margin-left: 2px;
  }
  .mic { color: var(--label-secondary); }
</style>
</head>
<body>
<div class="app">
  <div class="chat">
    <div class="stream">

      <div class="turn-user">
        <div class="bubble">批注是怎么跟着消息发给模型的？</div>
      </div>

      <!-- 被批注的原文：淡色底 + 虚线 + 序号 -->
      <div class="msg">
        <div class="status"><span class="n">1</span> 已处理</div>
        <p><span class="mark">选中的原文和评论会随下一条消息交给模型</span></p>
        <p>正文里只留下标记。</p>
      </div>

      <!-- 已发送回合：摘要块在用户气泡上方 -->
      <div class="turn-user">
        <div class="summary">
          <div class="summary-icon">1</div>
          <div class="summary-body">
            <div class="summary-title">1 条批注</div>
            <div class="summary-hint">悬停查看批注</div>
          </div>
        </div>
        <div class="bubble">那模型怎么知道说的是哪一段？</div>
      </div>

      <!-- 模型回指 chip -->
      <div class="msg">
        <div class="status"><span class="n">1</span> 已处理</div>
        <p>模型不需要重复原文，只要在回答里标出它指的是哪一段：<button class="chip" id="chip">批注 1</button></p>
        <p>标记留在原文里，摘要和评论跟着消息走。</p>
        <div class="status" style="margin-top: 12px;"><span class="n">3</span> 执行工具 3 次，其中 1 次失败</div>
      </div>

    </div>
  </div>

  <!-- chip 预览：固定在 chip 右下方，避开摘要块 -->
  <div class="preview" id="preview">
    <div class="preview-head">
      <span class="preview-title">批注 1</span>
      <button class="jump">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        <span>原文</span>
      </button>
    </div>
    <div class="preview-label">选中的文本</div>
    <div class="preview-quote">选中的原文和评论会随下一条消息交给模型</div>
    <div class="preview-label">用户评论</div>
    <div class="preview-comment">这里说的「下一条消息」包括图片吗？</div>
  </div>

  <!-- 输入区 -->
  <div class="composer">
    <div class="composer-card">
      <div class="editor">那评论为空时还会保留批注吗？</div>
      <div class="row">
        <div class="tools">
          <div class="iconbtn">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </div>
          <div class="iconbtn">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M11.5 6.2 6.9 10.8a2 2 0 0 1-2.8-2.8l4.9-4.9a3.2 3.2 0 0 1 4.5 4.5l-5.2 5.2a4.4 4.4 0 0 1-6.2-6.2l4.4-4.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </div>
          <span class="mode">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 1.8 14.2 13H1.8L8 1.8Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 6.4v2.8M8 11.1v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            完全访问
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <div class="trailing">
          <span class="picker">
            <span class="dot"></span>
            DeepSeek-V4-Flash
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="mic">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="5.6" y="1.6" width="4.8" height="8" rx="2.4" stroke="currentColor" stroke-width="1.3"/><path d="M3.2 7.6a4.8 4.8 0 0 0 9.6 0M8 12.4V14.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </span>
          <span class="send">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z" fill="currentColor"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
